version: "3.9"

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: finsight_postgres
    restart: always
    environment:
      POSTGRES_USER: finsight
      POSTGRES_PASSWORD: finsight
      POSTGRES_DB: finsight
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: